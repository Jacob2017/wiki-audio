# wiki-audio config — see github.com/Jacob2017/wiki-audio for docs.
# Run `wiki-audio doctor` after editing to verify.

[wiki]
# Absolute path to the directory containing PG essay markdown files.
# Each .md is one episode. Required.
source_dir = ""

[tts]
# ElevenLabs voice ID to render with. PLAN §10 default is Christopher
# (G17SuINrv2H9FC6nvetn). Browse api.elevenlabs.io/v1/voices for more.
voice_id = ""
voice_label = "Christopher"
# Defaults applied when omitted: model_id="eleven_flash_v2_5",
# chunk_max_chars=4000, request_timeout_s=60, retry_attempts=3,
# retry_backoff_base_s=2, output_format="mp3_44100_192".
#
# 192 kbps mono is the validated default — A/B testing on the
# Christopher voice (Phase E spike, 2026-05-09) showed audibly
# cleaner sibilants vs 64/128 kbps. ElevenLabs bills on input
# characters, not output bitrate, so the higher quality is free
# at synth time; storage rounds to ~3.6 GB across 53 essays
# (~$0.054/month on R2). See PLAN §8.7.

[r2]
# Cloudflare R2 account ID and bucket name. Both required.
# Endpoint URL is derived: https://<account_id>.r2.cloudflarestorage.com
account_id = ""
bucket = ""

[feed]
# Public Worker URL that fronts the R2 bucket. Must include scheme.
# Production hosts MUST use https:// for transport security.
base_url = "https://wiki-audio.example.workers.dev"
title = "PG Essays"
description = "Paul Graham essays read aloud."
author = "Paul Graham"
owner_email = ""
# Optional: cover_image_url = "https://..."
# Defaults applied when omitted: feed_path="pg.xml", language="en-us".
